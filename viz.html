<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- video.twimg.com answers 403 to foreign Referers (e.g. localhost); <video> has no referrerpolicy attribute, so set it page-wide. -->
<meta name="referrer" content="no-referrer">
<title>Embedding Map</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="gppl.css">
<link rel="stylesheet" href="viz.css">
</head>
<body>
<header class="bar">
  <div class="brand"><span class="mark">◎</span><div>Embedding Map<small>CLIP 512D → PCA 48D → 2D</small></div></div>
  <div class="setup">
    <label>配置 <select id="proj"><option value="tsne" selected>t-SNE</option><option value="pca">PCA (第1・第2主成分)</option></select></label>
    <label>色 <select id="color"><option value="mu" selected>好き度 μ</option><option value="shown">表示済み</option><option value="none">なし</option></select></label>
    <label>サイズ <input id="size" type="range" min="16" max="96" value="40"></label>
    <button id="fit" class="ghost">全体表示</button>
    <button id="tag-edit" class="ghost" title="CLIP ゼロショットのタグを編集">タグ編集</button>
    <input id="text-query" type="search" placeholder="英語で探す（例: beach | red dress）" title="Enter で、文章に近い動画を強調">
  </div>
  <div class="status"><span id="status">読み込み中…</span><div class="meter"><div id="meter-fill"></div></div></div>
  <div class="session"><a class="btnlink" href="index.html">← 戻る</a></div>
</header>

<main class="viz">
  <canvas id="canvas"></canvas>
  <div id="legend" class="legend"></div>
  <div id="tip" class="tip" hidden><img alt=""><div class="tip-t"></div><div class="tip-s"></div></div>
</main>

<section id="tag-editor" class="results" hidden>
  <div class="results-inner tag-editor-inner">
    <div class="results-head"><h2>タグ（CLIP ゼロショット）</h2><button type="button" class="ghost close">閉じる (Esc)</button></div>
    <p class="tag-help">各タグは「当てはまる説明」と「対比する説明」の英文のどちらに近いかで判定します（50%以上で該当）。<code>|</code> で区切ると複数の言い回しを平均します。判定は見た目からの推測なので目安です。</p>
    <div class="tag-row tag-head"><span>タグ名</span><span>当てはまる説明（英語）</span><span>対比する説明（英語）</span><span></span></div>
    <div id="tag-rows"></div>
    <div class="tag-actions"><button type="button" class="ghost add">＋ タグを追加</button><button type="button" class="ghost defaults">既定に戻す</button><button type="button" class="primary save">保存して計算</button></div>
  </div>
</section>

<aside id="panel" class="panel">
  <p class="placeholder">サムネをクリックすると、その動画の4フレームと、512次元の embedding 空間で近い動画（コサイン類似度）を表示します。<br><br>ホイールで拡大・ドラッグで移動。Esc か何もない所のクリックで選択解除。</p>
</aside>

<script src="config.js"></script>
<script type="module" src="js/viz.js"></script>
</body>
</html>
