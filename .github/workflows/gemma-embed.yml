# Precompute EmbeddingGemma 2 embeddings for the "動画（Gemma 2）" mode (tools/gemma-batch/embed.mjs).
# The result goes to the orphan branch `gemma-data` (force-pushed, no history), and the site reads
#   https://raw.githubusercontent.com/<owner>/<repo>/gemma-data/gemma.json
# so the browser only computes what the batch has not covered yet.
name: Gemma embeddings

on:
  schedule:
    - cron: "0 18 * * *"          # daily, 03:00 JST
  workflow_dispatch:
    inputs:
      new_pages:
        description: "new-arrival list pages to read"
        default: "5"
      max_new:
        description: "max embeddings this run"
        default: "1000"
  push:
    branches: [main]
    paths:
      - "tools/gemma-batch/**"
      - ".github/workflows/gemma-embed.yml"

permissions:
  contents: write

concurrency:
  group: gemma-embed
  cancel-in-progress: false

jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      OUT_DIR: ${{ github.workspace }}/data
      HF_CACHE_DIR: ${{ github.workspace }}/.hf-cache
      NEW_PAGES: ${{ github.event.inputs.new_pages || '5' }}
      MAX_NEW: ${{ github.event.inputs.max_new || '1000' }}
      TIME_BUDGET_MIN: "300"
    steps:
      - uses: actions/checkout@v4

      - name: Previous results
        run: |
          mkdir -p data
          if git fetch --depth=1 origin gemma-data; then
            git show FETCH_HEAD:gemma.json > data/gemma.json || true
          fi
          ls -la data

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: ffmpeg
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          fi
          ffprobe -version | head -1

      - name: Model cache
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: embeddinggemma-2-q4-clip-q8-v2

      - name: Install
        working-directory: tools/gemma-batch
        run: |
          for i in 1 2 3; do
            npm install --no-audit --no-fund --ignore-scripts && exit 0
            echo "npm install failed (attempt $i), retrying"; sleep 20
          done
          exit 1

      - name: Embed
        working-directory: tools/gemma-batch
        run: node embed.mjs

      - name: CLIP thumbnails
        working-directory: tools/gemma-batch
        run: node clip.mjs

      - name: Publish to gemma-data
        if: always()
        working-directory: data
        run: |
          # only after an Embed run that wrote its status (otherwise keep what is published)
          test -f gemma.json && test -f gemma-status.json || exit 0
          git init -q -b gemma-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gemma.json gemma-status.json
          git commit -q -m "EmbeddingGemma 2 embeddings $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gemma-data
          cat gemma-status.json
